[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revshell-mcp"
version = "0.1.0"
description = "리버스 셸 세션을 MCP 툴로 노출하는 핸들러 서버"
readme = "README.md"
# 3.11 미만에서는 설치 단계에서 명확히 거부된다. Pi OS Bullseye(3.9)에서
# 설치는 되고 런타임에 이상하게 깨지는 상황을 막는다.
requires-python = ">=3.11"
dependencies = [
    # server.py 는 mcp.server.MCPServer 를 쓴다 — 2.x 전용이다.
    # 1.x 의 mcp.server.fastmcp.FastMCP 와는 호환되지 않으므로 하한을 박는다.
    "mcp>=2.0",
]

[project.scripts]
revshell-mcp = "revshell_mcp.__main__:main"

[tool.setuptools]
packages = ["revshell_mcp"]
